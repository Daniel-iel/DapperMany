version: '3.8'

services:
  # SQL Server 2019
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: dappermany-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SqlServer123!"
      MSSQL_SA_PASSWORD: "SqlServer123!"
    ports:
      - "1433:1433"
    volumes:
      - ./sqlserver/init:/docker-entrypoint-initdb.d
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SqlServer123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dappermany-network

  # PostgreSQL 14
  postgres:
    image: postgres:14-alpine
    container_name: dappermany-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres123!
      POSTGRES_DB: dappermany
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dappermany-network

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: dappermany-mysql
    environment:
      MYSQL_ROOT_PASSWORD: MySql123!
      MYSQL_DATABASE: dappermany
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMySql123!"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dappermany-network

volumes:
  sqlserver-data:
  postgres-data:
  mysql-data:

networks:
  dappermany-network:
    driver: bridge
