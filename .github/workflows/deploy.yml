name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract-version
        run: |
          VERSION="${{ github.ref }}"
          VERSION="${VERSION#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start database containers (docker-compose)
        run: docker-compose up -d
        working-directory: ./docker

      - name: Wait for containers to be healthy
        run: |
          echo "Waiting for database containers to be ready..."
          for i in {1..60}; do
            if docker-compose ps | grep -q "(healthy)"; then
              echo "Database containers are healthy!"
              break
            fi
            echo "Waiting... attempt $i/60"
            sleep 2
          done
        working-directory: ./docker
        shell: bash

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test tests/DapperMany.UnitTests/DapperMany.UnitTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run MySQL integration tests
        run: dotnet test tests/DapperMany.MySql.IntegrationTests/DapperMany.MySql.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run PostgreSQL integration tests
        run: dotnet test tests/DapperMany.Postgres.IntegrationTests/DapperMany.Postgres.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run SQL Server integration tests
        run: dotnet test tests/DapperMany.SqlServer.IntegrationTests/DapperMany.SqlServer.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Stop database containers
        if: always()
        run: docker-compose down
        working-directory: ./docker

  publish:
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      id-token: write
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Check if version already published on NuGet
        run: |
          PACKAGES=("DapperMany" "DapperMany.MySql" "DapperMany.Postgres" "DapperMany.SqlServer")
          for PACKAGE in "${PACKAGES[@]}"; do
            echo "Checking if $PACKAGE v${{ env.PACKAGE_VERSION }} exists on NuGet..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/${{ env.PACKAGE_VERSION }}/index.json")
            if [ "$RESPONSE" = "200" ]; then
              echo "⚠️  Warning: $PACKAGE v${{ env.PACKAGE_VERSION }} already exists on NuGet. Skipping this version."
              echo "already_published=true" >> $GITHUB_ENV
            fi
          done
        shell: bash

      - name: Pack NuGet packages
        if: env.already_published != 'true'
        run: |
          dotnet pack src/DapperMany/DapperMany.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.MySql/DapperMany.MySql.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.Postgres/DapperMany.Postgres.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.SqlServer/DapperMany.SqlServer.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs

      - name: Verify package versions
        if: env.already_published != 'true'
        run: |
          echo "Verifying all packages have version ${{ env.PACKAGE_VERSION }}..."
          for nupkg in ./nupkgs/*.nupkg; do
            FILENAME=$(basename "$nupkg")
            if [[ $FILENAME == *".${{ env.PACKAGE_VERSION }}.nupkg" ]]; then
              echo "✓ $FILENAME has correct version"
            else
              echo "✗ $FILENAME does NOT match expected version"
              exit 1
            fi
          done

      - name: Upload packages as artifacts
        if: env.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg

      - name: NuGet login (OIDC → temporary API key)
        if: env.already_published != 'true'
        uses: NuGet/login@v1
        with:
          user: __OIDC__
          password: ${{ secrets.NUGET_PUBLISH_GH_TOKEN }}

      - name: Push packages to NuGet
        if: env.already_published != 'true'
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json
        shell: bash

      - name: Create GitHub Release
        if: env.already_published != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ env.PACKAGE_VERSION }}
          body: |
            Published NuGet packages for version ${{ env.PACKAGE_VERSION }}

            Packages:
            - DapperMany ${{ env.PACKAGE_VERSION }}
            - DapperMany.MySql ${{ env.PACKAGE_VERSION }}
            - DapperMany.Postgres ${{ env.PACKAGE_VERSION }}
            - DapperMany.SqlServer ${{ env.PACKAGE_VERSION }}
          draft: false
          prerelease: ${{ contains(env.PACKAGE_VERSION, '-') }}

      - name: Log if version already published
        if: env.already_published == 'true'
        run: |
          echo "Version ${{ env.PACKAGE_VERSION }} was already published. Skipping publish step."
          exit 0
