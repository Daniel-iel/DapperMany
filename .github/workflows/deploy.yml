name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract-version
        run: |
          VERSION="${{ github.ref }}"
          VERSION="${VERSION#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start database containers (docker-compose)
        run: docker-compose up -d
        working-directory: ./docker

      - name: Wait for containers to be healthy
        run: |
          echo "Waiting for database containers to be ready..."
          for i in {1..60}; do
            if docker-compose ps | grep -q "(healthy)"; then
              echo "Database containers are healthy!"
              break
            fi
            echo "Waiting... attempt $i/60"
            sleep 2
          done
        working-directory: ./docker
        shell: bash

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test tests/DapperMany.UnitTests/DapperMany.UnitTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run MySQL integration tests
        run: dotnet test tests/DapperMany.MySql.IntegrationTests/DapperMany.MySql.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run PostgreSQL integration tests
        run: dotnet test tests/DapperMany.Postgres.IntegrationTests/DapperMany.Postgres.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run SQL Server integration tests
        run: dotnet test tests/DapperMany.SqlServer.IntegrationTests/DapperMany.SqlServer.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Stop database containers
        if: always()
        run: docker-compose down
        working-directory: ./docker

  publish:
    runs-on: ubuntu-latest
    needs: [validate, test]
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Check if version already published on NuGet
        run: |
          PACKAGES=("DapperMany" "DapperMany.MySql" "DapperMany.Postgres" "DapperMany.SqlServer")
          echo "Checking if packages v${{ env.PACKAGE_VERSION }} are already published..."
          
          for PACKAGE in "${PACKAGES[@]}"; do
            echo ""
            echo "Checking $PACKAGE..."
            
            # Try v3 flat container API (most reliable)
            RESPONSE_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/${{ env.PACKAGE_VERSION }}/index.json")
            
            if [ "$RESPONSE_CODE" = "200" ]; then
              echo "❌ ERROR: $PACKAGE v${{ env.PACKAGE_VERSION }} already exists on NuGet!"
              echo "This version has already been published. You must increment the version number."
              echo "Current packages on NuGet:"
              curl -s "https://api.nuget.org/v3-flatcontainer/${PACKAGE,,}/index.json" | jq '.versions[-5:]' 2>/dev/null || echo "(unable to fetch versions)"
              echo "abort=true" >> $GITHUB_ENV
            else
              echo "✓ $PACKAGE v${{ env.PACKAGE_VERSION }} - not found (ready to publish)"
            fi
          done
          
          if [ "${{ env.abort }}" = "true" ]; then
            echo ""
            echo "❌ Publishing aborted: One or more packages already exist."
            echo "To fix: Increment version in Directory.Build.props and create a new tag."
            exit 1
          fi
        shell: bash

      - name: Pack NuGet packages
        run: |
          dotnet pack src/DapperMany/DapperMany.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.MySql/DapperMany.MySql.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.Postgres/DapperMany.Postgres.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs
          dotnet pack src/DapperMany.SqlServer/DapperMany.SqlServer.csproj --no-build --configuration Release /p:PackageVersion=${{ env.PACKAGE_VERSION }} --output ./nupkgs

      - name: Verify package versions
        run: |
          echo "Verifying all packages have version ${{ env.PACKAGE_VERSION }}..."
          for nupkg in ./nupkgs/*.nupkg; do
            FILENAME=$(basename "$nupkg")
            if [[ $FILENAME == *".${{ env.PACKAGE_VERSION }}.nupkg" ]]; then
              echo "✓ $FILENAME has correct version"
            else
              echo "✗ $FILENAME does NOT match expected version"
              exit 1
            fi
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          
      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Publishing: DapperMany"
          dotnet nuget push ./nupkgs/DapperMany.${{ env.PACKAGE_VERSION }}.nupkg --source "$NUGET_SOURCE" --api-key "${{ secrets.NUGET_API_KEY }}"
                                
          echo "Publishing: DapperMany.MySql"
          dotnet nuget push ./nupkgs/DapperMany.MySql.${{ env.PACKAGE_VERSION }}.nupkg --source "$NUGET_SOURCE" --api-key "${{ secrets.NUGET_API_KEY }}"
                                
          echo "Publishing: DapperMany.Postgres"
          dotnet nuget push ./nupkgs/DapperMany.Postgres.${{ env.PACKAGE_VERSION }}.nupkg --source "$NUGET_SOURCE" --api-key "${{ secrets.NUGET_API_KEY }}"
                                
          echo "Publishing: DapperMany.SqlServer"
          dotnet nuget push ./nupkgs/DapperMany.SqlServer.${{ env.PACKAGE_VERSION }}.nupkg --source "$NUGET_SOURCE" --api-key "${{ secrets.NUGET_API_KEY }}"
